name: SonarQube Scan
on:
  push:
    branches: ['devsecops-setup1', 'securevault-fixed','secdebt-integration']
  pull_request:
    branches: ['devsecops-setup1', 'securevault-fixed','secdebt-integration']
  workflow_dispatch:
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Generate Coverage Report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests_fixed/ -c pytest_fixed.ini --cov=app --cov=syscallguard --cov-report=xml || true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Generate Security Dashboard Summary
        if: always()
        run: |
          echo "## 📊 SonarQube Scan Generated" >> $GITHUB_STEP_SUMMARY
          echo "The SonarQube scan completed. Check the detailed analysis on [SonarCloud](https://sonarcloud.io)." >> $GITHUB_STEP_SUMMARY
