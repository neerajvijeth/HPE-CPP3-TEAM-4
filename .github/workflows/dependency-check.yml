name: OWASP Dependency Check Pipeline

on:
  workflow_dispatch:

jobs:
  refresh-nvd-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Restore existing NVD cache (if any)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-nvd-

      - name: Create data directory
        run: |
          mkdir -p odc-data
          chmod 777 odc-data

      - name: Download Full NVD Database
        run: |
          echo "🔄 Starting full NVD database download..."
          docker run --rm -u root \
            -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:latest \
            --updateonly \
            --nvdApiKey ${{ secrets.NVD_API_KEY }} \
            --nvdApiDelay 6000
          echo "✅ NVD database download complete!"

      - name: Save NVD Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-${{ steps.date.outputs.week }}

      - name: Report Status
        if: always()
        run: |
          if [ -f "odc-data/nvdcve*.h2.mv.db" ] || ls odc-data/*.db 2>/dev/null; then
            echo "## ✅ NVD Cache Refresh Complete" >> $GITHUB_STEP_SUMMARY
            echo "The NVD database has been successfully downloaded and cached." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Cache key:** ${{ runner.os }}-odc-nvd-$(date +'%Y-%U')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can now push code and the security scan will use this cache." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ NVD Cache Refresh Failed" >> $GITHUB_STEP_SUMMARY
            echo "The database download did not complete successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**What to do:**" >> $GITHUB_STEP_SUMMARY
            echo "- Wait a few hours and try running this workflow again manually" >> $GITHUB_STEP_SUMMARY
            echo "- NVD API (nvd.nist.gov) may be experiencing downtime" >> $GITHUB_STEP_SUMMARY
          fi