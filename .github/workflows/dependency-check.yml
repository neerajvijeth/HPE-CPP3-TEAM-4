name: OWASP Dependency Check Pipeline

on:
  push:
    branches: [ "main", "devsecops-setup1", "test/dependency-check" ]
  pull_request:
    branches: [ "main", "devsecops-setup1" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get week number for cache key
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache NVD Database
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-nvd-

      - name: Create Directories
        run: |
          mkdir -p odc-reports
          mkdir -p odc-data
          chmod 777 odc-reports
          chmod 777 odc-data

      - name: Run OWASP Dependency-Check
        run: |
          docker run --rm -u root \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/odc-reports:/report \
            -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:latest \
            --project "HPE-CPP3-TEAM-4-CTFd" \
            --scan /src \
            --format ALL \
            --out /report \
            --enableExperimental \
            --nvdApiKey ${{ secrets.NVD_API_KEY }} \
            --nvdMaxRetryCount 5 \
            --nvdApiDelay 6000 \
            --failOnCVSS 11
        continue-on-error: true

      - name: Generate Security Dashboard Summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f "odc-reports/dependency-check-report.json" ]; then
            TOTAL_DEPS=$(jq '.dependencies | length' odc-reports/dependency-check-report.json)
            VULN_DEPS=$(jq '.dependencies | map(select(has("vulnerabilities"))) | length' odc-reports/dependency-check-report.json)
            echo "## 🛡️ OWASP Dependency-Check Results" >> $GITHUB_STEP_SUMMARY
            echo "The scan completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "* **📦 Total Dependencies Scanned:** $TOTAL_DEPS" >> $GITHUB_STEP_SUMMARY
            echo "* **🚨 Vulnerable Dependencies Found:** $VULN_DEPS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the \`OWASP-Dependency-Check-Report\` artifact below." >> $GITHUB_STEP_SUMMARY
            echo "2. Open the HTML file for detailed CVE descriptions." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🛡️ OWASP Dependency-Check Results" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Scan failed to generate a report.** Check the 'Run OWASP Dependency-Check' step logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OWASP-Dependency-Check-Report
          path: odc-reports/