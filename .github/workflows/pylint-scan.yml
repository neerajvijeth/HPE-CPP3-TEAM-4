name: Pylint Scan

on:
  push:
    branches:
      - devsecops-setup1
      - securevault-fixed
      - secdebt-integration

  pull_request:
    branches:
      - devsecops-setup1
      - securevault-fixed
      - secdebt-integration

  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint

      - name: Run Pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pylint app/ --fail-under=7 --ignore=migrations | tee pylint-report.txt

      - name: Upload report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "pylint-report.txt"
          target: "/home/ubuntu/secdebt-reports/"
        continue-on-error: true

      - name: Generate Security Dashboard Summary
        if: always()
        run: |
          echo "## 📝 Pylint Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pylint-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY