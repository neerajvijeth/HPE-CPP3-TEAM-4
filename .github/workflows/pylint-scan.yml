name: Pylint Scan
on:
  push:
    branches: ['securevault-fixed']
  pull_request:
    branches: ['securevault-fixed']
  workflow_dispatch:
jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint
      - name: Run Pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pylint app/ --fail-under=7 --ignore=migrations | tee pylint-report.txt
      - name: Generate Security Dashboard Summary
        if: always()
        run: |
          echo "## 📝 Pylint Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pylint-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
