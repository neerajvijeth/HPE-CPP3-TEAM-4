name: SecureVault Secure DevSecOps Pipeline

on:
  push:
    branches:
      - hps-secure
      - final_refinements
  pull_request:
    branches:
      - hps-secure
      - final_refinements
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pytest tests_fixed/ -c pytest_fixed.ini -v --tb=short --cov=app --cov-report=xml:coverage.xml | tee pytest-report.txt
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "pytest-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Pytest report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "pytest-report.txt"
          target: "/home/${{ secrets.EC2_USER }}/secdebt-reports/"
        continue-on-error: true

      - name: Upload Pytest Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.txt
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint
      - name: Run Pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pylint app/ --fail-under=7 --ignore=migrations | tee pylint-report.txt
      - name: Generate Lint Summary
        if: always()
        run: |
          echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "pylint-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pylint-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Pylint report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "pylint-report.txt"
          target: "/home/ubuntu/secdebt-reports/"
        continue-on-error: true

      - name: Upload Pylint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pylint-report
          path: pylint-report.txt

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit
      - name: Run Bandit
        run: |
          set -o pipefail
          bandit -r app/ -ll | tee bandit-report.txt
      - name: Upload report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "bandit-report.txt"
          target: "/home/ubuntu/secdebt-reports/"
        continue-on-error: true
      - name: Generate Bandit Summary
        if: always()
        run: |
          echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "bandit-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat bandit-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Bandit report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.txt


          
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image for Trivy
        run: |
          docker build -t securevault_secure:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securevault_secure:${{ github.sha }}
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          output: trivy-results.txt
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate Trivy Summary
        if: always()
        run: |
          echo "## Trivy Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "trivy-results.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Trivy report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "trivy-results.txt"
          target: "/home/ubuntu/secdebt-reports/"
        continue-on-error: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: bandit-results.txt
  
  
      

  dependency-check:
    runs-on: ubuntu-latest
    # timeout-minutes: 20
    # continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Get cache week
        id: date
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: Restore NVD Database Cache
        id: restore-odc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-v2-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-nvd-v2-

      - name: Create Directories
        run: |
          mkdir -p odc-reports
          mkdir -p odc-data
          chmod 777 odc-reports
          chmod 777 odc-data

      - name: Check NVD Cache
        id: odc-cache-check
        run: |
          if [ -f odc-data/odc.mv.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "NVD cache found: $(du -sh odc-data | cut -f1)"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No NVD cache found. Dependency-Check will try one online update scan."
          fi

      - name: Run OWASP Dependency-Check
        timeout-minutes: 5
        continue-on-error: true
        id: odc-scan
        run: |
          set +e

          if [ "${{ steps.odc-cache-check.outputs.found }}" = "true" ]; then
            echo "NVD cache restored. Running Dependency-Check without updating NVD data."

            docker run --rm -u root \
              -v ${{ github.workspace }}:/src \
              -v ${{ github.workspace }}/odc-reports:/report \
              -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
              owasp/dependency-check:12.1.0 \
              --project "SecureVault-Secure" \
              --scan /src \
              --format ALL \
              --out /report \
              --enableExperimental \
              --exclude "**/migrations/**" \
              --exclude "**/tests_fixed/**" \
              --exclude "**/.git/**" \
              --noupdate

            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            echo "Cached Dependency-Check scan failed with status ${status}. Trying one online update scan."
          else
            echo "No NVD cache restored. Running one online Dependency-Check update scan."
          fi

          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "NVD_API_KEY secret is required when no valid NVD cache is available."
            {
              echo "OWASP Dependency-Check could not run."
              echo "Reason: no valid cached NVD database and NVD_API_KEY is missing."
            } | tee odc-reports/dependency-check-status.txt
            exit 0
          fi

          docker run --rm -u root \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/odc-reports:/report \
            -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:12.1.0 \
            --project "SecureVault-Secure" \
            --scan /src \
            --format ALL \
            --out /report \
            --enableExperimental \
            --exclude "**/migrations/**" \
            --exclude "**/tests_fixed/**" \
            --exclude "**/.git/**" \
            --nvdApiKey ${{ secrets.NVD_API_KEY }} \
            --nvdApiDelay 3500 \
            --nvdMaxRetryCount 10 \
            --nvdValidForHours 168

          status=$?

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          echo "Dependency-Check failed with status ${status}."

          if [ ! -f "odc-reports/dependency-check-report.json" ]; then
            {
              echo "OWASP Dependency-Check could not generate a report."
              echo "Reason: NVD cache was missing/invalid or NVD update failed inside the 20-minute job limit."
              echo "Last exit status: ${status}"
            } | tee odc-reports/dependency-check-status.txt
            exit "$status"
          fi

          exit "$status"

      - name: Save Fallback NVD Database Cache
        uses: actions/cache/save@v4
        if: always() && hashFiles('odc-data/odc.mv.db') != ''
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-v2-${{ steps.date.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate Dependency-Check Summary
        if: always()
        run: |
          if [ -f "odc-reports/dependency-check-report.json" ]; then
            TOTAL_DEPS=$(jq '.dependencies | length' odc-reports/dependency-check-report.json)
            VULN_DEPS=$(jq '.dependencies | map(select(has("vulnerabilities"))) | length' odc-reports/dependency-check-report.json)
            echo "## OWASP Dependency-Check Results" >> $GITHUB_STEP_SUMMARY
            echo "- Total dependencies scanned: $TOTAL_DEPS" >> $GITHUB_STEP_SUMMARY
            echo "- Vulnerable dependencies found: $VULN_DEPS" >> $GITHUB_STEP_SUMMARY
          else
            echo "## OWASP Dependency-Check Results" >> $GITHUB_STEP_SUMMARY
            echo "Report generation failed because the NVD feed was unavailable after retries." >> $GITHUB_STEP_SUMMARY
            if [ -f "odc-reports/dependency-check-status.txt" ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat odc-reports/dependency-check-status.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload JSON report to EC2 for SecDebt ingestion
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "odc-reports/dependency-check-report.json"
          target: "/home/ubuntu/secdebt-reports/"
        continue-on-error: true
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OWASP-Dependency-Check-Report
          path: odc-reports/dependency-check-report.html
      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OWASP-Dependency-Check-JSON
          path: odc-reports/dependency-check-report.json
      - name: Upload Dependency-Check Status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OWASP-Dependency-Check-Status
          path: odc-reports/dependency-check-status.txt

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Generate coverage for SonarCloud
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests_fixed/ -c pytest_fixed.ini --cov=app --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      # - name: Check SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Generate Sonar Summary
        if: always()
        run: |
          echo "## SonarQube Scan" >> $GITHUB_STEP_SUMMARY
          echo "Detailed analysis is available in SonarCloud for this run." >> $GITHUB_STEP_SUMMARY

  docker-build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Final_refinements'
    needs:
      - pytest
      - pylint
      - bandit
      - trivy
      # - dependency-check
      - sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: |
          docker build \
            -t sanudocker11/secure_vault_secure:${{ github.sha }} \
            -t sanudocker11/secure_vault_secure:latest \
            .
      - name: Push Docker Image
        run: |
          docker push sanudocker11/secure_vault_secure:${{ github.sha }}
          docker push sanudocker11/secure_vault_secure:latest

  deploy-ec2-secure:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/Final_refinements'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Secure EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /home/${{ secrets.EC2_USER }}/secdebt-reports/odc-reports
            echo "Docker usage before cleanup"
            sudo docker system df || true

            echo "Cleaning unused Docker images and build cache before pulling new image"
            sudo docker image prune -af || true
            sudo docker builder prune -af || true

            sudo docker pull sanudocker11/secure_vault_secure:${{ github.sha }}
            sudo docker image inspect sanudocker11/secure_vault_secure:${{ github.sha }} >/dev/null

            sudo docker network create securevault-secure-net || true

            sudo docker volume create securevault_secure_data || true

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^securevault_secure_db$'; then
              echo "Postgres container already exists. Starting it if needed."
              sudo docker start securevault_secure_db || true
            else
              echo "Creating Postgres container."
              sudo docker run -d \
                --name securevault_secure_db \
                --network securevault-secure-net \
                -v securevault_secure_data:/var/lib/postgresql/data \
                -e POSTGRES_DB=securevault \
                -e POSTGRES_USER=securevault \
                -e POSTGRES_PASSWORD=securevault \
                postgres:14
            fi

            sleep 15

            echo "Running database migrations before replacing app container"
            sudo docker run --rm \
              --network securevault-secure-net \
              -v /home/${{ secrets.EC2_USER }}/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              -e SKIP_DB_MIGRATION=true \
              -e FLASK_APP=run.py \
              --entrypoint flask \
              sanudocker11/secure_vault_secure:${{ github.sha }} \
              db upgrade

            sudo docker stop securevault_secure_app || true
            sudo docker rm securevault_secure_app || true

            sudo docker run -d \
              --name securevault_secure_app \
              --network securevault-secure-net \
              -p 80:8000 \
              -v /home/${{ secrets.EC2_USER }}/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              -e SKIP_DB_MIGRATION=true \
              sanudocker11/secure_vault_secure:${{ github.sha }}

            sleep 20

            sudo docker ps

            if ! sudo docker ps --filter "name=securevault_secure_app" --filter "status=running" --format '{{.Names}}' | grep -q '^securevault_secure_app$'; then
              echo "securevault_secure_app is not running after deployment"
              sudo docker logs securevault_secure_app || true
              exit 1
            fi

            APP_HEALTHY=false
            for attempt in $(seq 1 10); do
              if curl --silent --show-error --fail --max-time 5 http://localhost > /dev/null; then
                APP_HEALTHY=true
                break
              fi

              echo "Waiting for SecureVault HTTP health check (attempt $attempt/10)"
              sleep 5
            done

            if [ "$APP_HEALTHY" != "true" ]; then
              echo "securevault_secure_app is running but HTTP health check failed"
              sudo docker logs securevault_secure_app || true
              exit 1
            fi

            echo "Docker usage after deployment"
            sudo docker system df || true
            echo "Disk usage after deployment"
            df -h

  secdebt-ingest:
    needs: deploy-ec2-secure
    if: github.event_name == 'push' && github.ref == 'refs/heads/Final_refinements'
    runs-on: ubuntu-latest
    continue-on-error: true
  
    steps:
      - name: Trigger SecDebt ingest
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_SECURE }}
          SECDEBT_TOKEN: ${{ secrets.SECDEBT_INGEST_TOKEN }}
        run: |
          HOST="$(printf '%s' "$EC2_HOST" | xargs)"
  
          if [ -z "$HOST" ] || [ -z "$SECDEBT_TOKEN" ]; then
            echo "EC2_HOST_SECURE or SECDEBT_INGEST_TOKEN is missing. Skipping SecDebt ingest."
            exit 0
          fi
  
          curl --fail --silent --show-error \
            -X POST "http://${HOST}/secdebt/api/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Token: ${SECDEBT_TOKEN}" \
            -d "{
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"triggered_by\": \"github-actions\"
            }" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10
  
      - name: Report ingest summary
        if: always()
        run: |
          echo "## 📊 SecDebt Optimizer Ingest" >> $GITHUB_STEP_SUMMARY
          echo "- Reports were already uploaded directly to EC2 by each SAST job." >> $GITHUB_STEP_SUMMARY
          echo "- Triggered SecDebt ingestion API." >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: http://${{ secrets.EC2_HOST_SECURE }}/secdebt" >> $GITHUB_STEP_SUMMARY

          
  dast-target-check:
    needs:
      - deploy-ec2-secure
      - secdebt-ingest
    if: github.event_name == 'push' && github.ref == 'refs/heads/Final_refinements'
    runs-on: ubuntu-latest
    steps:
      - name: Normalize ZAP target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          if [ -z "$HOST" ]; then
            echo "EC2_HOST_SECURE is empty after trimming."
            exit 1
          fi
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Wait for deployed app to become reachable
        run: |
          TARGET_URL="${EC2_TARGET_URL}"

          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 10 "$TARGET_URL" > /dev/null; then
              echo "Application is reachable at $TARGET_URL"
              exit 0
            fi

            echo "Waiting for application at $TARGET_URL (attempt $attempt/12)"
            sleep 10
          done

          echo "Application did not become reachable in time"
          exit 1

  nikto-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run Nikto scan with mounted report
        run: |
          mkdir -p dast-reports/nikto
          chmod 777 dast-reports/nikto

          set +e
          docker run --rm \
            --user root \
            -v "$PWD/dast-reports/nikto:/reports" \
            ghcr.io/sullo/nikto:latest \
            -h "$EC2_TARGET_URL" \
            -nointeractive \
            -timeout 10 \
            -maxtime 10m \
            -Format xml \
            -output /reports/nikto-report.xml \
            2>&1 | tee dast-reports/nikto/nikto-scan.log
          NIKTO_EXIT=${PIPESTATUS[0]}
          set -e

          sudo chmod -R a+rwX dast-reports/nikto || true

          if [ -s dast-reports/nikto/nikto-report.xml ]; then
            echo "Nikto completed and generated nikto-report.xml." | tee dast-reports/nikto/nikto-summary.txt
          else
            echo "Nikto did not generate nikto-report.xml. Check nikto-scan.log." | tee dast-reports/nikto/nikto-summary.txt
          fi

          echo "Nikto exit code: $NIKTO_EXIT" | tee -a dast-reports/nikto/nikto-summary.txt

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("dast-reports/nikto/nikto-report.xml")
          summary = Path("dast-reports/nikto/nikto-summary.txt")
          status = Path("dast-reports/nikto/nikto-status.txt")

          allowed_prefixes = (
              "OPTIONS: Allowed HTTP Methods:",
          )

          def write_result(result, lines):
              with summary.open("a", encoding="utf-8") as handle:
                  for line in lines:
                      handle.write(f"{line}\n")
              status.write_text(f"{result}\n", encoding="utf-8")

          if not report.exists() or report.stat().st_size == 0:
              write_result("fail", ["Nikto XML report missing. Treating scan as failed."])
              raise SystemExit(0)

          try:
              root = ET.parse(report).getroot()
          except ET.ParseError as exc:
              write_result("fail", [f"Nikto XML report could not be parsed: {exc}"])
              raise SystemExit(0)

          findings = []
          for item in root.iter("item"):
              description = (item.findtext("description") or "").strip()
              uri = (item.findtext("uri") or "").strip()
              findings.append((description, uri))

          blocking = [
              (description, uri)
              for description, uri in findings
              if not any(description.startswith(prefix) for prefix in allowed_prefixes)
          ]

          lines = [
              f"Nikto total findings: {len(findings)}",
              f"Nikto blocking findings: {len(blocking)}",
          ]
          for description, uri in blocking:
              lines.append(f"Blocking finding at {uri}: {description}")

          write_result("fail" if blocking else "pass", lines)
          PY

      - name: Upload Nikto Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nikto-dast-report
          path: dast-reports/nikto/

  nuclei-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run Nuclei scan
        run: |
          mkdir -p dast-reports/nuclei
          chmod 777 dast-reports/nuclei

          docker run --rm \
            projectdiscovery/nuclei:latest \
            -version | tee dast-reports/nuclei/nuclei-version.txt || true

          set +e
          timeout 15m docker run --rm \
            -v "$PWD/dast-reports/nuclei:/reports" \
            projectdiscovery/nuclei:latest \
            -u "$EC2_TARGET_URL" \
            -rate-limit 25 \
            -c 20 \
            -retries 1 \
            -timeout 5 \
            -severity medium,high,critical \
            -tags cve,exposure,misconfig,default-login,takeover \
            -etags dos,fuzz,bruteforce,enum,intrusive,headless,oast \
            -ni \
            -jsonl \
            -o /reports/nuclei-report.jsonl \
            2>&1 | tee dast-reports/nuclei/nuclei-scan.log
          NUCLEI_EXIT=${PIPESTATUS[0]}
          set -e


          sudo chmod -R a+rwX dast-reports/nuclei || true

          echo "Nuclei exit code: $NUCLEI_EXIT" | tee dast-reports/nuclei/nuclei-summary.txt

          NUCLEI_INCOMPLETE=0
          if [ "$NUCLEI_EXIT" -eq 124 ]; then
            NUCLEI_INCOMPLETE=1
            echo "Nuclei hit the 15-minute CI timebox. Treating as incomplete warning unless findings were produced." | tee -a dast-reports/nuclei/nuclei-summary.txt
          fi

          FINDING_COUNT=0
          if [ -s dast-reports/nuclei/nuclei-report.jsonl ]; then
            FINDING_COUNT=$(wc -l < dast-reports/nuclei/nuclei-report.jsonl | xargs)
            echo "Nuclei completed and found $FINDING_COUNT finding(s)." | tee -a dast-reports/nuclei/nuclei-summary.txt
          else
            touch dast-reports/nuclei/nuclei-report.jsonl
            echo "Nuclei completed but produced no findings for $EC2_TARGET_URL." | tee -a dast-reports/nuclei/nuclei-summary.txt
          fi

          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "fail" > dast-reports/nuclei/nuclei-status.txt
          elif [ "$NUCLEI_INCOMPLETE" -eq 1 ]; then
            echo "warn" > dast-reports/nuclei/nuclei-status.txt
          else
            echo "pass" > dast-reports/nuclei/nuclei-status.txt
          fi

      - name: Upload Nuclei Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-dast-report
          path: dast-reports/nuclei/

  zap-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p dast-reports/zap
          chmod 777 dast-reports/zap

          set +e
          docker run --rm \
            -v "$PWD/dast-reports/zap:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t "$EC2_TARGET_URL" \
            -m 3 \
            -T 10 \
            -a \
            -r zap-report.html \
            -J zap-report.json \
            -x zap-report.xml \
            -w zap-report.md \
            2>&1 | tee dast-reports/zap/zap-scan.log
          ZAP_EXIT=${PIPESTATUS[0]}
          set -e

          sudo chmod -R a+rwX dast-reports/zap || true

          if [ -s dast-reports/zap/zap-report.html ] || [ -s dast-reports/zap/zap-report.json ] || [ -s dast-reports/zap/zap-report.xml ]; then
            echo "ZAP completed and generated report files." | tee dast-reports/zap/zap-summary.txt
          else
            echo "ZAP did not generate report files. Check zap-scan.log." | tee dast-reports/zap/zap-summary.txt
          fi

          echo "ZAP exit code: $ZAP_EXIT" | tee -a dast-reports/zap/zap-summary.txt

          if [ ! -s dast-reports/zap/zap-report.json ]; then
            echo "ZAP JSON report missing. Treating scan as failed." | tee -a dast-reports/zap/zap-summary.txt
            echo "fail" > dast-reports/zap/zap-status.txt
          else
            HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 3)] | length' dast-reports/zap/zap-report.json)
            echo "ZAP high/critical findings: $HIGH_COUNT" | tee -a dast-reports/zap/zap-summary.txt

            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "fail" > dast-reports/zap/zap-status.txt
            else
              echo "pass" > dast-reports/zap/zap-status.txt
            fi
          fi

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: dast-reports/zap/

  dast-release-gate:
    needs:
      - dast-target-check
      - nikto-dast
      - nuclei-dast
      - zap-dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/Final_refinements'
    runs-on: ubuntu-latest
    steps:
      - name: Download DAST artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dast-artifacts

      - name: Evaluate DAST gate
        env:
          TARGET_CHECK_RESULT: ${{ needs.dast-target-check.result }}
          NIKTO_JOB_RESULT: ${{ needs.nikto-dast.result }}
          NUCLEI_JOB_RESULT: ${{ needs.nuclei-dast.result }}
          ZAP_JOB_RESULT: ${{ needs.zap-dast.result }}
        run: |
          mkdir -p dast-gate
          DAST_FAILED=0

          {
            echo "DAST target check: $TARGET_CHECK_RESULT"
            echo "Nikto job: $NIKTO_JOB_RESULT"
            echo "Nuclei job: $NUCLEI_JOB_RESULT"
            echo "ZAP job: $ZAP_JOB_RESULT"
          } | tee dast-gate/dast-gate-summary.txt

          if [ "$TARGET_CHECK_RESULT" != "success" ]; then
            echo "DAST target check failed or was skipped." | tee -a dast-gate/dast-gate-summary.txt
            DAST_FAILED=1
          fi

          for status_file in \
            dast-artifacts/nikto-dast-report/nikto-status.txt \
            dast-artifacts/nuclei-dast-report/nuclei-status.txt \
            dast-artifacts/zap-dast-report/zap-status.txt
          do
            if [ ! -f "$status_file" ]; then
              echo "Missing DAST status file: $status_file" | tee -a dast-gate/dast-gate-summary.txt
              DAST_FAILED=1
              continue
            fi

            STATUS="$(cat "$status_file" | xargs)"
            echo "$status_file: $STATUS" | tee -a dast-gate/dast-gate-summary.txt

            if [ "$STATUS" = "warn" ]; then
              echo "$status_file produced a warning. Continuing because no blocking findings were reported." | tee -a dast-gate/dast-gate-summary.txt
              continue
            fi

            if [ "$STATUS" != "pass" ]; then
              DAST_FAILED=1
            fi
          done

          echo "DAST_FAILED=$DAST_FAILED" >> "$GITHUB_ENV"

          if [ "$DAST_FAILED" -eq 0 ]; then
            echo "DAST gate passed. Current image can be promoted to stable." | tee -a dast-gate/dast-gate-summary.txt
          else
            echo "DAST gate failed. Current deployment must be rolled back to stable." | tee -a dast-gate/dast-gate-summary.txt
          fi

      - name: Promote image to stable
        if: env.DAST_FAILED == '0'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker pull sanudocker11/secure_vault_secure:${{ github.sha }}
          docker tag sanudocker11/secure_vault_secure:${{ github.sha }} sanudocker11/secure_vault_secure:stable
          docker push sanudocker11/secure_vault_secure:stable

      - name: Roll back EC2 to stable image
        if: env.DAST_FAILED == '1'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /home/${{ secrets.EC2_USER }}/secdebt-reports/odc-reports
            echo "Docker usage before rollback cleanup"
            sudo docker system df || true

            if ! sudo docker pull sanudocker11/secure_vault_secure:stable; then
              echo "Stable image does not exist or cannot be pulled. Keeping current deployment untouched."
              exit 1
            fi
            sudo docker image inspect sanudocker11/secure_vault_secure:stable >/dev/null

            echo "Cleaning unused Docker images and build cache after stable image is verified"
            sudo docker image prune -af || true
            sudo docker builder prune -af || true

            sudo docker network create securevault-secure-net || true
            sudo docker volume create securevault_secure_data || true

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^securevault_secure_db$'; then
              echo "Postgres container already exists. Starting it if needed."
              sudo docker start securevault_secure_db || true
            else
              echo "Creating Postgres container."
              sudo docker run -d \
                --name securevault_secure_db \
                --network securevault-secure-net \
                -v securevault_secure_data:/var/lib/postgresql/data \
                -e POSTGRES_DB=securevault \
                -e POSTGRES_USER=securevault \
                -e POSTGRES_PASSWORD=securevault \
                postgres:14
            fi

            sleep 15

            echo "Running database migrations before replacing app container with stable image"
            sudo docker run --rm \
              --network securevault-secure-net \
              -v /home/${{ secrets.EC2_USER }}/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              -e SKIP_DB_MIGRATION=true \
              -e FLASK_APP=run.py \
              --entrypoint flask \
              sanudocker11/secure_vault_secure:stable \
              db upgrade

            sudo docker stop securevault_secure_app || true
            sudo docker rm securevault_secure_app || true

            sudo docker run -d \
              --name securevault_secure_app \
              --network securevault-secure-net \
              -p 80:8000 \
              -v /home/${{ secrets.EC2_USER }}/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              -e SKIP_DB_MIGRATION=true \
              sanudocker11/secure_vault_secure:stable

            sleep 20

            if ! sudo docker ps --filter "name=securevault_secure_app" --filter "status=running" --format '{{.Names}}' | grep -q '^securevault_secure_app$'; then
              echo "Rollback failed: securevault_secure_app is not running after redeploying stable."
              sudo docker logs securevault_secure_app || true
              exit 1
            fi

            echo "Docker usage after rollback"
            sudo docker system df || true
            echo "Disk usage after rollback"
            df -h

      - name: Upload DAST gate summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-release-gate-summary
          path: dast-gate/

      - name: Fail workflow after rollback
        if: env.DAST_FAILED == '1'
        run: |
          echo "DAST gate failed. Rolled back to stable image."
          exit 1
