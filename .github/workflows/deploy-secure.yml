name: SecureVault Secure DevSecOps Pipeline

on:
  push:
    branches:
      - devsecops-final
  pull_request:
    branches:
      - devsecops-final
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pytest tests_fixed/ -c pytest_fixed.ini -v --tb=short --cov=app --cov-report=xml:coverage.xml | tee pytest-report.txt
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "pytest-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Pytest report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint
      - name: Run Pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pylint app/ --fail-under=7 --ignore=migrations | tee pylint-report.txt
      - name: Generate Lint Summary
        if: always()
        run: |
          echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "pylint-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pylint-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Pylint report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Pylint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pylint-report
          path: pylint-report.txt

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit
      - name: Run Bandit
        run: |
          set -o pipefail
          bandit -r app/ -ll | tee bandit-report.txt
      - name: Generate Bandit Summary
        if: always()
        run: |
          echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "bandit-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat bandit-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Bandit report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image for Trivy
        run: |
          docker build -t securevault_secure:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securevault_secure:${{ github.sha }}
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          output: trivy-results.txt
          ignore-unfixed: true
          exit-code: "0"
      - name: Generate Trivy Summary
        if: always()
        run: |
          echo "## Trivy Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "trivy-results.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Trivy report was not generated. Check earlier step logs." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      # ── Restore the NVD cache built by the refresh workflow ──
      - name: Restore NVD Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/odc-data
          key: ${{ runner.os }}-odc-nvd-v2-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-nvd-v2

      - name: Verify cache exists
        id: cache-check
        run: |
          if [ -f odc-data/odc.mv.db ]; then
            DB_SIZE=$(du -sh odc-data/ | cut -f1)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ NVD cache found — size: $DB_SIZE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "❌ No NVD cache found at all. Run the 'OWASP NVD Cache Refresh' workflow first."
          fi

      - name: Fail fast if no cache available
        if: steps.cache-check.outputs.found != 'true'
        run: |
          echo "## ❌ No NVD Cache Available" >> $GITHUB_STEP_SUMMARY
          echo "Trigger the **OWASP NVD Cache Refresh** workflow and let it complete before running a scan." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Create report directory
        run: mkdir -p odc-report

      # ── Scan using the cached DB only — never touches NVD ──
      - name: Run Dependency-Check scan
        id: scan
        run: |
          docker run --rm -u root \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
            -v ${{ github.workspace }}/odc-report:/report \
            owasp/dependency-check:latest \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /report \
            --noupdate \
            --enableExperimental \
            --exclude "**/migrations/**" \
            --exclude "**/tests_fixed/**" \
            --exclude "**/.git/**" \
            --project "${{ github.repository }}"
        continue-on-error: true

      - name: Check report was generated
        id: report-check
        run: |
          if [ -f odc-report/dependency-check-report.json ]; then
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "generated=false" >> $GITHUB_OUTPUT
            echo "⚠️ No JSON report found — scan may have failed before producing output"
          fi

      # ── Upload the HTML report as a downloadable artifact ──
      - name: Upload HTML report artifact
        if: steps.report-check.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OWASP-Dependency-Check-Report
          path: odc-report/dependency-check-report.html
          retention-days: 30

      - name: Upload JSON report artifact
        if: steps.report-check.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OWASP-Dependency-Check-JSON
          path: odc-report/dependency-check-report.json
          retention-days: 30

      # ── Build a severity-count summary from the JSON report ──
      - name: Summarize results in Job Summary
        if: always()
        run: |
          if [ "${{ steps.report-check.outputs.generated }}" != "true" ]; then
            echo "## ❌ Dependency-Check Scan Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No report was produced. Check the scan step logs above." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          REPORT=odc-report/dependency-check-report.json

          TOTAL_DEPS=$(jq '.dependencies | length' "$REPORT")
          VULN_DEPS=$(jq '[.dependencies[] | select(.vulnerabilities != null and (.vulnerabilities | length) > 0)] | length' "$REPORT")
          TOTAL_VULNS=$(jq '[.dependencies[].vulnerabilities[]?] | length' "$REPORT")
          CRITICAL=$(jq '[.dependencies[].vulnerabilities[]? | select((.severity // .cvssv3.baseSeverity // "") | ascii_downcase == "critical")] | length' "$REPORT")
          HIGH=$(jq '[.dependencies[].vulnerabilities[]? | select((.severity // .cvssv3.baseSeverity // "") | ascii_downcase == "high")] | length' "$REPORT")
          MEDIUM=$(jq '[.dependencies[].vulnerabilities[]? | select((.severity // .cvssv3.baseSeverity // "") | ascii_downcase == "medium")] | length' "$REPORT")
          LOW=$(jq '[.dependencies[].vulnerabilities[]? | select((.severity // .cvssv3.baseSeverity // "") | ascii_downcase == "low")] | length' "$REPORT")

          echo "## 🔍 OWASP Dependency-Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies scanned | $TOTAL_DEPS |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies with vulnerabilities | $VULN_DEPS |" >> $GITHUB_STEP_SUMMARY
          echo "| Total vulnerabilities found | $TOTAL_VULNS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$VULN_DEPS" -gt 0 ]; then
            echo "### Top vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Dependency | Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|------------------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.dependencies[] | select(.vulnerabilities != null and (.vulnerabilities | length) > 0)
                | {name: .fileName, count: (.vulnerabilities | length)}]
              | sort_by(-.count) | .[:10]
              | .[] | "| \(.name) | \(.count) |"
            ' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "📄 Full HTML report is attached as a workflow artifact (**OWASP-Dependency-Check-Report**)." >> $GITHUB_STEP_SUMMARY

      - name: Fail the job if the scan itself errored
        if: steps.report-check.outputs.generated != 'true'
        run: exit 1

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Generate coverage for SonarCloud
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests_fixed/ -c pytest_fixed.ini --cov=app --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Generate Sonar Summary
        if: always()
        run: |
          echo "## SonarQube Scan" >> $GITHUB_STEP_SUMMARY
          echo "Detailed analysis is available in SonarCloud for this run." >> $GITHUB_STEP_SUMMARY

  docker-build-push:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/devsecops-final'
    needs:
      - pytest
      - pylint
      - bandit
      - trivy
      # - dependency-check
      - sonarcloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t sanudocker11/secure_vault_secure:${{ github.sha }} \
            -t sanudocker11/secure_vault_secure:latest \
            .

      - name: Push Docker Image
        run: |
          docker push sanudocker11/secure_vault_secure:${{ github.sha }}
          docker push sanudocker11/secure_vault_secure:latest

  deploy-ec2-secure:
    needs: docker-build-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/devsecops-final'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy SecureVault to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
          
            sudo mkdir -p /home/ubuntu/secdebt-reports
            echo "Pulling latest image..."

            if ! sudo docker pull sanudocker11/secure_vault_secure:${{ github.sha }}; then
                echo "Docker pull failed."
                exit 1
            fi
            
            echo "Image pulled successfully."
            
            sudo docker image inspect sanudocker11/secure_vault_secure:${{ github.sha }} >/dev/null
            echo "Current containers"
            sudo docker ps 

            

      
            
            if sudo docker ps -a --format '{{.Names}}' | grep -q '^securevault_secure_app$'; then
            
                CURRENT_IMAGE=$(sudo docker inspect \
                    --format='{{.Config.Image}}' \
                    securevault_secure_app)
            
                echo "Current image: $CURRENT_IMAGE"
            
                sudo docker stop securevault_secure_app || true
                sudo docker rm securevault_secure_app || true
            
            else
                echo "No previous application container found."
            
            fi
            sudo docker network create securevault-secure-net || true

            sudo docker volume create securevault_secure_data || true

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^securevault_secure_db$'; then

                echo "Postgres container already exists."
            
                sudo docker start securevault_secure_db || true
            
            else
            
                echo "Creating Postgres container..."
            
                sudo docker run -d \
                  --name securevault_secure_db \
                  --network securevault-secure-net \
                  -v securevault_secure_data:/var/lib/postgresql/data \
                  -e POSTGRES_DB=securevault \
                  -e POSTGRES_USER=securevault \
                  -e POSTGRES_PASSWORD=securevault \
                  postgres:14
            
                sleep 15
            
            fi

            sleep 15

            sudo docker run -d \
              --name securevault_secure_app \
              --network securevault-secure-net \
              -p 80:8000 \
              -v /home/ubuntu/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              sanudocker11/secure_vault_secure:${{ github.sha }}

            sleep 20

            echo "Waiting for application..."

            sleep 20
            
            for i in {1..10}; do
                if curl -f http://localhost >/dev/null 2>&1; then
                    echo "Application is healthy."
                    HEALTHY=true
                    break
                fi
            
                echo "Waiting for application... ($i/10)"
                sleep 5
            done
            
            if [ "${HEALTHY:-false}" != "true" ]; then

                echo "Deployment failed."

              sudo docker logs securevault_secure_app || true
              
              sudo docker stop securevault_secure_app || true
              sudo docker rm securevault_secure_app || true
              
              echo "Checking whether stable image exists..."
              
              if sudo docker pull sanudocker11/secure_vault_secure:stable; then
              
                  echo "Stable image found."
                  echo "Rolling back..."
              
                  sudo docker run -d \
                    --name securevault_secure_app \
                    --network securevault-secure-net \
                    -p 80:8000 \
                    -v /home/ubuntu/secdebt-reports:/reports \
                    -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
                    -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
                    -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
                    -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
                    sanudocker11/secure_vault_secure:stable
              
              else
              
                  echo "No stable image exists."
                  echo "This is probably the first deployment."
              
              fi
              
              exit 1
            
            fi
            
            echo "Deployment successful."

            echo "Cleaning old Docker images..."

            sudo docker image prune -af
            
            echo "Cleaning build cache..."
            
            sudo docker builder prune -af || true
            
            echo "Docker usage after cleanup"
            
            sudo docker system df
            
            echo "Disk usage"
            
            df -h
            echo "Running containers after deployment"

            sudo docker ps

  secdebt-ingest:
    needs: deploy-ec2-secure
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/devsecops-final'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: secdebt-artifacts

      - name: Prepare SecDebt report bundle
        run: |
          mkdir -p secdebt-upload/odc-reports

          cp secdebt-artifacts/bandit-report/bandit-report.txt secdebt-upload/bandit-report.txt 2>/dev/null || true
          cp secdebt-artifacts/pylint-report/pylint-report.txt secdebt-upload/pylint-report.txt 2>/dev/null || true
          cp secdebt-artifacts/trivy-results/trivy-results.txt secdebt-upload/trivy-results.txt 2>/dev/null || true
          cp secdebt-artifacts/OWASP-Dependency-Check-JSON/dependency-check-report.json secdebt-upload/odc-reports/dependency-check-report.json 2>/dev/null || true

          echo "Generated by GitHub Actions for SecDebt ingestion." > secdebt-upload/README.txt
          find secdebt-upload -maxdepth 3 -type f -print

      - name: Reset remote SecDebt report directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/secdebt-reports/odc-reports
            rm -f /home/${{ secrets.EC2_USER }}/secdebt-reports/bandit-report.txt
            rm -f /home/${{ secrets.EC2_USER }}/secdebt-reports/pylint-report.txt
            rm -f /home/${{ secrets.EC2_USER }}/secdebt-reports/trivy-results.txt
            rm -f /home/${{ secrets.EC2_USER }}/secdebt-reports/odc-reports/dependency-check-report.json

      - name: Copy reports to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "secdebt-upload/*"
          target: "/home/${{ secrets.EC2_USER }}/secdebt-reports"
          strip_components: 1

      - name: Trigger SecDebt ingest
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_SECURE }}
          SECDEBT_TOKEN: ${{ secrets.SECDEBT_INGEST_TOKEN }}
        run: |
          HOST="$(printf '%s' "$EC2_HOST" | xargs)"

          if [ -z "$HOST" ] || [ -z "$SECDEBT_TOKEN" ]; then
            echo "EC2_HOST_SECURE or SECDEBT_INGEST_TOKEN is missing. Skipping SecDebt ingest."
            exit 0
          fi

          curl --fail --silent --show-error \
            -X POST "http://${HOST}/secdebt/api/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Token: ${SECDEBT_TOKEN}" \
            -d "{
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"triggered_by\": \"github-actions\"
            }" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10

  dast-target-check:
    needs:
      - deploy-ec2-secure
      - secdebt-ingest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/devsecops-final'
    runs-on: ubuntu-latest
    steps:
      - name: Normalize ZAP target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          if [ -z "$HOST" ]; then
            echo "EC2_HOST_SECURE is empty after trimming."
            exit 1
          fi
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Wait for deployed app to become reachable
        run: |
          TARGET_URL="${EC2_TARGET_URL}"

          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 10 "$TARGET_URL" > /dev/null; then
              echo "Application is reachable at $TARGET_URL"
              exit 0
            fi

            echo "Waiting for application at $TARGET_URL (attempt $attempt/12)"
            sleep 10
          done

          echo "Application did not become reachable in time"
          exit 1

  nikto-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run Nikto scan with mounted report
        run: |
          mkdir -p dast-reports/nikto
          chmod 777 dast-reports/nikto

          set +e
          docker run --rm \
            --user root \
            -v "$PWD/dast-reports/nikto:/reports" \
            ghcr.io/sullo/nikto:latest \
            -h "$EC2_TARGET_URL" \
            -nointeractive \
            -timeout 10 \
            -maxtime 10m \
            -Format xml \
            -output /reports/nikto-report.xml \
            2>&1 | tee dast-reports/nikto/nikto-scan.log
          NIKTO_EXIT=${PIPESTATUS[0]}
          set -e

          sudo chmod -R a+rwX dast-reports/nikto || true

          if [ -s dast-reports/nikto/nikto-report.xml ]; then
            echo "Nikto completed and generated nikto-report.xml." | tee dast-reports/nikto/nikto-summary.txt
          else
            echo "Nikto did not generate nikto-report.xml. Check nikto-scan.log." | tee dast-reports/nikto/nikto-summary.txt
          fi

          if [ "$NIKTO_EXIT" -ne 0 ]; then
            echo "fail" > dast-reports/nikto/nikto-status.txt
          else
            echo "pass" > dast-reports/nikto/nikto-status.txt
          fi

      - name: Upload Nikto Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nikto-dast-report
          path: dast-reports/nikto/

  nuclei-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run Nuclei scan
        run: |
          mkdir -p dast-reports/nuclei
          chmod 777 dast-reports/nuclei

          docker run --rm \
            projectdiscovery/nuclei:latest \
            -version | tee dast-reports/nuclei/nuclei-version.txt || true

          set +e
          docker run --rm \
            -v "$PWD/dast-reports/nuclei:/reports" \
            projectdiscovery/nuclei:latest \
            -u "$EC2_TARGET_URL" \
            -rate-limit 5 \
            -c 5 \
            -retries 1 \
            -timeout 5 \
            -severity low,medium,high,critical \
            -jsonl \
            -o /reports/nuclei-report.jsonl \
            2>&1 | tee dast-reports/nuclei/nuclei-scan.log
          NUCLEI_EXIT=${PIPESTATUS[0]}
          set -e


          sudo chmod -R a+rwX dast-reports/nuclei || true

          if [ -s dast-reports/nuclei/nuclei-report.jsonl ]; then
            FINDING_COUNT=$(wc -l < dast-reports/nuclei/nuclei-report.jsonl | xargs)
            echo "Nuclei completed and found $FINDING_COUNT finding(s)." | tee dast-reports/nuclei/nuclei-summary.txt
          else
            touch dast-reports/nuclei/nuclei-report.jsonl
            echo "Nuclei completed but produced no findings for $EC2_TARGET_URL." | tee dast-reports/nuclei/nuclei-summary.txt
          fi

          if [ "$NUCLEI_EXIT" -ne 0 ] || [ -s dast-reports/nuclei/nuclei-report.jsonl ]; then
            echo "fail" > dast-reports/nuclei/nuclei-status.txt
          else
            echo "pass" > dast-reports/nuclei/nuclei-status.txt
          fi

      - name: Upload Nuclei Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-dast-report
          path: dast-reports/nuclei/

  zap-dast:
    needs: dast-target-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Normalize target URL
        run: |
          HOST="$(printf '%s' '${{ secrets.EC2_HOST_SECURE }}' | xargs)"
          echo "EC2_TARGET_URL=http://${HOST}" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p dast-reports/zap
          chmod 777 dast-reports/zap

          set +e
          docker run --rm \
            -v "$PWD/dast-reports/zap:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t "$EC2_TARGET_URL" \
            -m 3 \
            -T 10 \
            -a \
            -r zap-report.html \
            -J zap-report.json \
            -x zap-report.xml \
            -w zap-report.md \
            2>&1 | tee dast-reports/zap/zap-scan.log
          ZAP_EXIT=${PIPESTATUS[0]}
          set -e

          sudo chmod -R a+rwX dast-reports/zap || true

          if [ -s dast-reports/zap/zap-report.html ] || [ -s dast-reports/zap/zap-report.json ] || [ -s dast-reports/zap/zap-report.xml ]; then
            echo "ZAP completed and generated report files." | tee dast-reports/zap/zap-summary.txt
          else
            echo "ZAP did not generate report files. Check zap-scan.log." | tee dast-reports/zap/zap-summary.txt
          fi

          # ZAP exit codes: 0=pass, 1=warnings only (low/info), 2=failures (medium/high)
          # Only fail the gate on actual failures, not low-risk informational warnings
          if [ "$ZAP_EXIT" -ge 2 ]; then
            echo "fail" > dast-reports/zap/zap-status.txt
          else
            echo "pass" > dast-reports/zap/zap-status.txt
          fi

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: dast-reports/zap/

  dast-release-gate:
    needs:
      - dast-target-check
      - nikto-dast
      - nuclei-dast
      - zap-dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops-final'
    runs-on: ubuntu-latest
    steps:
      - name: Download DAST artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dast-artifacts

      - name: Evaluate DAST gate
        env:
          TARGET_CHECK_RESULT: ${{ needs.dast-target-check.result }}
          NIKTO_JOB_RESULT: ${{ needs.nikto-dast.result }}
          NUCLEI_JOB_RESULT: ${{ needs.nuclei-dast.result }}
          ZAP_JOB_RESULT: ${{ needs.zap-dast.result }}
        run: |
          mkdir -p dast-gate
          DAST_FAILED=0

          {
            echo "DAST target check: $TARGET_CHECK_RESULT"
            echo "Nikto job: $NIKTO_JOB_RESULT"
            echo "Nuclei job: $NUCLEI_JOB_RESULT"
            echo "ZAP job: $ZAP_JOB_RESULT"
          } | tee dast-gate/dast-gate-summary.txt

          if [ "$TARGET_CHECK_RESULT" != "success" ]; then
            echo "DAST target check failed or was skipped." | tee -a dast-gate/dast-gate-summary.txt
            DAST_FAILED=1
          fi

          for status_file in \
            dast-artifacts/nikto-dast-report/nikto-status.txt \
            dast-artifacts/nuclei-dast-report/nuclei-status.txt \
            dast-artifacts/zap-dast-report/zap-status.txt
          do
            if [ ! -f "$status_file" ]; then
              echo "Missing DAST status file: $status_file" | tee -a dast-gate/dast-gate-summary.txt
              DAST_FAILED=1
              continue
            fi

            STATUS="$(cat "$status_file" | xargs)"
            echo "$status_file: $STATUS" | tee -a dast-gate/dast-gate-summary.txt

            if [ "$STATUS" != "pass" ]; then
              DAST_FAILED=1
            fi
          done

          echo "DAST_FAILED=$DAST_FAILED" >> "$GITHUB_ENV"

          if [ "$DAST_FAILED" -eq 0 ]; then
            echo "DAST gate passed. Current image can be promoted to stable." | tee -a dast-gate/dast-gate-summary.txt
          else
            echo "DAST gate failed. Current deployment must be rolled back to stable." | tee -a dast-gate/dast-gate-summary.txt
          fi

      - name: Promote image to stable
        if: env.DAST_FAILED == '0'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker pull sanudocker11/secure_vault_secure:${{ github.sha }}
          docker tag sanudocker11/secure_vault_secure:${{ github.sha }} sanudocker11/secure_vault_secure:stable
          docker push sanudocker11/secure_vault_secure:stable

      - name: Roll back EC2 to stable image
        if: env.DAST_FAILED == '1'
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST_SECURE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /home/ubuntu/secdebt-reports

            # Check if :stable tag exists before attempting rollback
            if ! docker manifest inspect sanudocker11/secure_vault_secure:stable >/dev/null 2>&1; then

                echo "No stable image exists."
                echo "Keeping current deployment running."
            
                exit 0
            
            fi
            
            sudo docker pull sanudocker11/secure_vault_secure:stable

            echo "Stable image found. Rolling back..."

            sudo docker stop securevault_secure_app || true
            sudo docker rm securevault_secure_app || true

            sudo docker network create securevault-secure-net || true
            sudo docker volume create securevault_secure_data || true

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^securevault_secure_db$'; then
                echo "Postgres container already exists."
                sudo docker start securevault_secure_db || true
            else
                echo "Creating Postgres container..."
                sudo docker run -d \
                  --name securevault_secure_db \
                  --network securevault-secure-net \
                  -v securevault_secure_data:/var/lib/postgresql/data \
                  -e POSTGRES_DB=securevault \
                  -e POSTGRES_USER=securevault \
                  -e POSTGRES_PASSWORD=securevault \
                  postgres:14
                sleep 15
            fi

            sleep 15

            sudo docker run -d \
              --name securevault_secure_app \
              --network securevault-secure-net \
              -p 80:8000 \
              -v /home/ubuntu/secdebt-reports:/reports \
              -e DATABASE_URL="postgresql://securevault:securevault@securevault_secure_db:5432/securevault" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY_SECURE }}" \
              -e VAULT_ENCRYPTION_KEY="${{ secrets.VAULT_ENCRYPTION_KEY_SECURE }}" \
              -e SECDEBT_INGEST_TOKEN="${{ secrets.SECDEBT_INGEST_TOKEN }}" \
              sanudocker11/secure_vault_secure:stable

            sleep 20

            if ! sudo docker ps \
                --filter "name=securevault_secure_app" \
                --filter "status=running" \
                --format "{{.Names}}" \
                | grep -q "^securevault_secure_app$"; then
                echo "Rollback failed: securevault_secure_app is not running after redeploying stable."
                sudo docker logs securevault_secure_app || true
                exit 1
            fi

      - name: Upload DAST gate summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-release-gate-summary
          path: dast-gate/

      - name: Fail workflow after rollback
        if: env.DAST_FAILED == '1'
        run: |
          echo "DAST gate failed. Rolled back to stable image."
          exit 1
