apiVersion: v1
kind: ServiceAccount
metadata:
  name: securevault-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securevault-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securevault-binding
subjects:
- kind: ServiceAccount
  name: securevault-sa
roleRef:
  kind: Role
  name: securevault-role
  apiGroup: rbac.authorization.k8s.io
